name: Deploy Portfolio to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required public envs
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" ]; then
            echo "NEXT_PUBLIC_CONTACT_FORM_ENDPOINT secret is missing"
            exit 1
          fi

      - name: Build project
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: bun run build

      - name: Verify Next standalone artifacts
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d public

      - name: Prepare SSH access to Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          ORACLE_USER: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          mkdir -p /tmp/nf-deploy-archives
          tar -C .next/standalone -cf /tmp/nf-deploy-archives/standalone.tar .
          tar -C .next/static -cf /tmp/nf-deploy-archives/static.tar .
          tar -C public -cf /tmp/nf-deploy-archives/public.tar .
          split -b 32m -d -a 3 /tmp/nf-deploy-archives/standalone.tar /tmp/nf-deploy-archives/standalone.tar.part-
          split -b 32m -d -a 3 /tmp/nf-deploy-archives/static.tar /tmp/nf-deploy-archives/static.tar.part-
          split -b 32m -d -a 3 /tmp/nf-deploy-archives/public.tar /tmp/nf-deploy-archives/public.tar.part-

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'rm -rf /tmp/nf-next-upload && mkdir -p /tmp/nf-next-upload/standalone /tmp/nf-next-upload/static /tmp/nf-next-upload/public /tmp/nf-next-upload/parts/standalone /tmp/nf-next-upload/parts/static /tmp/nf-next-upload/parts/public'

      - name: Upload Next.js artifacts to Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          ORACLE_USER: ${{ secrets.ORACLE_USER_NORBERTFILA }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          upload_parts() {
            local pattern=$1
            local remote_dir=$2

            for file in $pattern; do
              echo "Uploading $(basename "$file")"

              local attempt=1
              while [ "$attempt" -le 4 ]; do
                if scp -O -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -i ~/.ssh/oracle_key "$file" "$ORACLE_USER@$ORACLE_HOST:$remote_dir/"; then
                  break
                fi

                if [ "$attempt" -eq 4 ]; then
                  echo "Failed to upload $file after $attempt attempts"
                  exit 1
                fi

                sleep 5
                attempt=$((attempt + 1))
              done
            done
          }

          upload_parts "/tmp/nf-deploy-archives/standalone.tar.part-*" "/tmp/nf-next-upload/parts/standalone"
          upload_parts "/tmp/nf-deploy-archives/static.tar.part-*" "/tmp/nf-next-upload/parts/static"
          upload_parts "/tmp/nf-deploy-archives/public.tar.part-*" "/tmp/nf-next-upload/parts/public"

          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" '
            cat > /tmp/nf-unpack.sh <<"EOF"
            #!/usr/bin/env bash
            set -euo pipefail
            trap 'code=$?; printf "%s" "$code" > /tmp/nf-unpack.exit' EXIT
            rm -f /tmp/nf-unpack.exit
            rm -rf /tmp/nf-next-upload/standalone /tmp/nf-next-upload/static /tmp/nf-next-upload/public
            mkdir -p /tmp/nf-next-upload/standalone /tmp/nf-next-upload/static /tmp/nf-next-upload/public
            cat /tmp/nf-next-upload/parts/standalone/standalone.tar.part-* > /tmp/nf-next-upload/standalone.tar
            cat /tmp/nf-next-upload/parts/static/static.tar.part-* > /tmp/nf-next-upload/static.tar
            cat /tmp/nf-next-upload/parts/public/public.tar.part-* > /tmp/nf-next-upload/public.tar
            tar -xf /tmp/nf-next-upload/standalone.tar -C /tmp/nf-next-upload/standalone
            tar -xf /tmp/nf-next-upload/static.tar -C /tmp/nf-next-upload/static
            tar -xf /tmp/nf-next-upload/public.tar -C /tmp/nf-next-upload/public
            rm -rf /tmp/nf-next-upload/parts
            rm -f /tmp/nf-next-upload/standalone.tar /tmp/nf-next-upload/static.tar /tmp/nf-next-upload/public.tar
            EOF
            chmod +x /tmp/nf-unpack.sh
            nohup /tmp/nf-unpack.sh >/tmp/nf-unpack.log 2>&1 < /dev/null &
          '

          for _ in $(seq 1 120); do
            if ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'test -f /tmp/nf-unpack.exit'; then
              break
            fi

            sleep 5
          done

          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" '
            test -f /tmp/nf-unpack.exit || {
              echo "Timed out waiting for remote unpack"
              tail -n 200 /tmp/nf-unpack.log || true
              exit 1
            }

            test "$(cat /tmp/nf-unpack.exit)" = "0" || {
              echo "Remote unpack failed"
              tail -n 200 /tmp/nf-unpack.log || true
              exit 1
            }
          '

      - name: Configure and restart Next service
        uses: appleboy/ssh-action@master
        env:
          SECURITY_CSP_MODE: ${{ secrets.SECURITY_CSP_MODE }}
        with:
          host: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          username: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          key: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
          envs: SECURITY_CSP_MODE
          script: |
            set -e

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            node -v
            npm -v

            sudo mkdir -p /opt/nf-portfolio
            sudo chown -R $USER:$USER /opt/nf-portfolio

            find /opt/nf-portfolio -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -R /tmp/nf-next-upload/standalone/. /opt/nf-portfolio/
            mkdir -p /opt/nf-portfolio/.next
            cp -R /tmp/nf-next-upload/static /opt/nf-portfolio/.next/
            cp -R /tmp/nf-next-upload/public /opt/nf-portfolio/

            if [ ! -f /opt/nf-portfolio/.next/BUILD_ID ]; then
              echo "Missing /opt/nf-portfolio/.next/BUILD_ID after copy"
              ls -la /opt/nf-portfolio || true
              ls -la /opt/nf-portfolio/.next || true
              exit 1
            fi

            cat > /tmp/nf-portfolio.service <<'EOF'
            [Unit]
            Description=NF Portfolio Next.js App
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/opt/nf-portfolio
            Environment=NODE_ENV=production
            Environment=PORT=3000
            ExecStart=/usr/bin/env node /opt/nf-portfolio/server.js
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo mv /tmp/nf-portfolio.service /etc/systemd/system/nf-portfolio.service
            sudo chmod 644 /etc/systemd/system/nf-portfolio.service
            sudo systemctl daemon-reload
            sudo systemctl enable nf-portfolio
            sudo systemctl restart nf-portfolio
            sudo systemctl is-active --quiet nf-portfolio

            if sudo systemctl list-unit-files | grep -q '^nf-ebook-api\.service'; then
              sudo systemctl disable --now nf-ebook-api || true
              sudo rm -f /etc/systemd/system/nf-ebook-api.service
              sudo systemctl daemon-reload
            fi

            CSP_MODE=${SECURITY_CSP_MODE:-enforce}
            if [ "$CSP_MODE" != "report-only" ] && [ "$CSP_MODE" != "enforce" ]; then
              echo "Invalid SECURITY_CSP_MODE: $CSP_MODE (allowed: report-only, enforce)"
              exit 1
            fi

            export CSP_MODE
            sudo -E python3 <<'PY'
            import os
            import re
            from pathlib import Path

            p = Path('/etc/nginx/sites-available/norbertfila.com')
            c = p.read_text()

            c = re.sub(r"\n\s*# BEGIN nf-next-app\n(?:\s+.*\n)*?\s*# END nf-next-app\n", "\n", c)
            c = re.sub(r"\n\s*# BEGIN nf-ebook-api\n(?:\s+.*\n)*?\s*# END nf-ebook-api\n", "\n", c)
            c = re.sub(r"\n\s*# BEGIN nf-security-headers\n(?:\s+.*\n)*?\s*# END nf-security-headers\n", "\n", c)
            c = re.sub(r"\n\s*# BEGIN nf-next-static\n(?:\s+.*\n)*?\s*# END nf-next-static\n", "\n", c)
            c = re.sub(r"\n\s*location /api/ebook-subscribe \{\n(?:\s+.*\n)*?\s*\}\n", "\n", c)
            c = re.sub(r"\n\s*location / \{\n(?:\s+.*\n)*?\s*\}\n", "\n", c, count=1)

            # Remove rogue regex location blocks that might be intercepting fonts or images
            c = re.sub(r"\n\s*location\s+~\*?\s+[^\{]+\{\s*[^}]*\}\n", "\n", c)

            csp_value = (
                "default-src 'self'; "
                "base-uri 'self'; "
                "object-src 'none'; "
                "frame-ancestors 'none'; "
                "img-src 'self' data: https://cdn.jsdelivr.net; "
                "font-src 'self' https://fonts.gstatic.com data:; "
                "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
                "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms; "
                "connect-src 'self' https://formspree.io https://www.google-analytics.com https://region1.google-analytics.com https://www.clarity.ms https://c.clarity.ms; "
                "form-action 'self'; "
                "upgrade-insecure-requests"
            )

            csp_header_name = 'Content-Security-Policy' if os.environ.get('CSP_MODE') == 'enforce' else 'Content-Security-Policy-Report-Only'

            security_block = (
                "    # BEGIN nf-security-headers\n"
                "    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n"
                "    add_header X-Frame-Options \"SAMEORIGIN\" always;\n"
                "    add_header X-Content-Type-Options \"nosniff\" always;\n"
                "    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n"
                "    add_header Permissions-Policy \"accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()\" always;\n"
                "    add_header Cross-Origin-Resource-Policy \"same-origin\" always;\n"
                f"    add_header {csp_header_name} \"{csp_value}\" always;\n"
                "    # END nf-security-headers\n\n"
            )

            next_static_block = (
                "    # BEGIN nf-next-static\n"
                "    location ^~ /_next/static/ {\n"
                "        alias /opt/nf-portfolio/.next/static/;\n"
                "        access_log off;\n"
                "        expires 365d;\n"
                "        add_header Cache-Control \"public, max-age=31536000, immutable\";\n"
                "    }\n"
                "    # END nf-next-static\n\n"
            )

            next_block = (
                "    # BEGIN nf-next-app\n"
                "    location / {\n"
                "        proxy_pass http://127.0.0.1:3000;\n"
                "        proxy_http_version 1.1;\n"
                "        proxy_set_header Host $host;\n"
                "        proxy_set_header X-Real-IP $remote_addr;\n"
                "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n"
                "        proxy_set_header X-Forwarded-Proto $scheme;\n"
                "        proxy_set_header Upgrade $http_upgrade;\n"
                "        proxy_set_header Connection \"upgrade\";\n"
                "    }\n"
                "    # END nf-next-app\n\n"
            )

            server_open = c.find('server {')
            if server_open == -1:
                raise SystemExit('Cannot find nginx server block')

            insert_at = c.find('\n}', server_open)
            if insert_at == -1:
                raise SystemExit('Cannot find nginx server block end')

            blocks = security_block + next_static_block + next_block
            p.write_text(c[:insert_at] + '\n' + blocks + c[insert_at:])
            PY

            sudo nginx -t
            sudo systemctl reload nginx

            rm -rf /tmp/nf-next-upload

      - name: Verify Next.js app endpoint
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          username: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          key: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
          script: |
            set -e

            if ! sudo systemctl is-active --quiet nf-portfolio; then
              echo "nf-portfolio service is not active"
              echo "---- debug: nf-portfolio status ----"
              sudo systemctl --no-pager --full status nf-portfolio || true
              echo "---- debug: nf-portfolio logs ----"
              sudo journalctl -u nf-portfolio -n 120 --no-pager || true
              exit 1
            fi

            status_local=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
            if [ "$status_local" != "200" ]; then
              echo "Unexpected local Next app status code: $status_local"
              echo "---- debug: nf-portfolio status ----"
              sudo systemctl --no-pager --full status nf-portfolio || true
              echo "---- debug: nf-portfolio logs ----"
              sudo journalctl -u nf-portfolio -n 120 --no-pager || true
              echo "---- debug: local headers ----"
              curl -sS -D - -o /dev/null http://127.0.0.1:3000/ || true
              exit 1
            fi

            status_public=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/)
            if [ "$status_public" != "200" ]; then
              echo "Unexpected public Next app status code: $status_public"
              echo "---- debug: public headers ----"
              curl -sS -D - -o /dev/null https://norbertfila.com/ || true
              exit 1
            fi

            status_local_portfolio=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/portfolio)
            if [ "$status_local_portfolio" != "200" ]; then
              echo "Unexpected local portfolio status code: $status_local_portfolio"
              echo "---- debug: local portfolio headers ----"
              curl -sS -D - -o /dev/null http://127.0.0.1:3000/portfolio || true
              exit 1
            fi

            status_public_portfolio=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/portfolio)
            if [ "$status_public_portfolio" != "200" ]; then
              echo "Warning: public portfolio status code is $status_public_portfolio"
              echo "---- debug: public portfolio headers ----"
              curl -sS -D - -o /dev/null https://norbertfila.com/portfolio || true
            fi

            status_robots=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/robots.txt)
            if [ "$status_robots" != "200" ]; then
              echo "Unexpected robots.txt status code: $status_robots"
              curl -sS -D - -o /dev/null https://norbertfila.com/robots.txt || true
              exit 1
            fi

            status_sitemap=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/sitemap.xml)
            if [ "$status_sitemap" != "200" ]; then
              echo "Unexpected sitemap.xml status code: $status_sitemap"
              curl -sS -D - -o /dev/null https://norbertfila.com/sitemap.xml || true
              exit 1
            fi

      - name: Cleanup on failure
        if: failure()
        run: rm -rf /tmp/nf-deploy-archives && echo "Deployment failed - Check the logs above."

      - name: Cleanup local deploy archives
        if: always()
        run: rm -rf /tmp/nf-deploy-archives
