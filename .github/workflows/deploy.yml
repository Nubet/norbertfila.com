name: Deploy Portfolio to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required public envs
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" ]; then
            echo "NEXT_PUBLIC_CONTACT_FORM_ENDPOINT secret is missing"
            exit 1
          fi

      - name: Build project
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: bun run build

      - name: Prepare SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Deploy application over SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          ORACLE_USER: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          APP_DIR: ${{ secrets.APP_DIR || vars.APP_DIR }}
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL || vars.CERTBOT_EMAIL }}
        run: |
          ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            "APP_DIR='$APP_DIR' NEXT_PUBLIC_CONTACT_FORM_ENDPOINT='$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT' CERTBOT_EMAIL='$CERTBOT_EMAIL' bash -se" < .github/scripts/deploy-remote.sh

      - name: Verify deployed app
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          ORACLE_USER: ${{ secrets.ORACLE_USER_NORBERTFILA }}
        run: |
          ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -se' < .github/scripts/verify-remote.sh

      - name: Cleanup on failure
        if: failure()
        run: echo "Deployment failed - Check the logs above."
