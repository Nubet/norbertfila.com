name: Deploy Portfolio to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required public envs
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" ]; then
            echo "NEXT_PUBLIC_CONTACT_FORM_ENDPOINT secret is missing"
            exit 1
          fi

      - name: Build project
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: bun run build

      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR || vars.APP_DIR }}
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL || vars.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          username: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          key: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
          envs: APP_DIR,NEXT_PUBLIC_CONTACT_FORM_ENDPOINT,CERTBOT_EMAIL
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:$PATH"

            if [ -z "${APP_DIR:-}" ]; then
              echo "APP_DIR secret is missing"
              exit 1
            fi

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git
            fi

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if ! command -v unzip >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y unzip
            fi

            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y certbot python3-certbot-nginx
            fi

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/Nubet/norbertfila.com.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git checkout main
            git pull --ff-only origin main

            printf 'NEXT_PUBLIC_CONTACT_FORM_ENDPOINT=%s\n' "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" > .env.production

            bun install --frozen-lockfile
            bun run build

            if [ ! -f /etc/nginx/sites-available/norbertfila.com ]; then
              cat > /tmp/norbertfila.com <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name norbertfila.com www.norbertfila.com;

                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                add_header Cross-Origin-Resource-Policy "same-origin" always;

                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            EOF

              sudo mv /tmp/norbertfila.com /etc/nginx/sites-available/norbertfila.com
            fi

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sfn /etc/nginx/sites-available/norbertfila.com /etc/nginx/sites-enabled/norbertfila.com
            sudo nginx -t
            sudo systemctl reload nginx

            if [ ! -d /etc/letsencrypt/live/norbertfila.com ]; then
              if [ -z "${CERTBOT_EMAIL:-}" ]; then
                echo "CERTBOT_EMAIL secret is required for first certificate issuance"
                exit 1
              fi

              sudo certbot --nginx --non-interactive --agree-tos --redirect -m "$CERTBOT_EMAIL" -d norbertfila.com -d www.norbertfila.com
            fi

            if pm2 describe nf-portfolio >/dev/null 2>&1; then
              pm2 reload nf-portfolio --update-env
            else
              pm2 start npm --name nf-portfolio --cwd "$APP_DIR" -- start -- --hostname 127.0.0.1 --port 3000
            fi

            pm2 save
            sudo env PATH="$PATH" pm2 startup systemd -u "$USER" --hp "$HOME" >/tmp/nf-pm2-startup.log 2>&1 || true

      - name: Verify deployed app
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_IP_NORBERTFILA }}
          username: ${{ secrets.ORACLE_USER_NORBERTFILA }}
          key: ${{ secrets.ORACLE_SSH_KEY_NORBERTFILA }}
          script: |
            set -euo pipefail

            if ! pm2 describe nf-portfolio >/dev/null 2>&1; then
              echo "nf-portfolio process is missing in pm2"
              pm2 list || true
              exit 1
            fi

            status_local=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
            if [ "$status_local" != "200" ]; then
              echo "Unexpected local status code: $status_local"
              pm2 logs nf-portfolio --lines 120 --nostream || true
              exit 1
            fi

            status_public=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/)
            if [ "$status_public" != "200" ]; then
              echo "Unexpected public status code: $status_public"
              curl -sS -D - -o /dev/null https://norbertfila.com/ || true
              exit 1
            fi

            status_sitemap=$(curl -s -o /dev/null -w "%{http_code}" https://norbertfila.com/sitemap.xml)
            if [ "$status_sitemap" != "200" ]; then
              echo "Unexpected sitemap.xml status code: $status_sitemap"
              curl -sS -D - -o /dev/null https://norbertfila.com/sitemap.xml || true
              exit 1
            fi

      - name: Cleanup on failure
        if: failure()
        run: echo "Deployment failed - Check the logs above."
