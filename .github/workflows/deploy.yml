name: Validate Portfolio Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required public envs
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_FORM_ENDPOINT" ]; then
            echo "NEXT_PUBLIC_CONTACT_FORM_ENDPOINT secret is missing"
            exit 1
          fi

      - name: Lint project
        run: bun run lint

      - name: Typecheck project
        run: bun run typecheck

      - name: Build project
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT || vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
        run: bun run build
